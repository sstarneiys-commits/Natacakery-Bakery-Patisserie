<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Sources &amp; Credits | Natacakery</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cream: {
                            50: '#FDFBF7',
                            100: '#FAF3E8',
                            200: '#F5E6D3',
                            300: '#EBD4B9'
                        },
                        rose: {
                            100: '#F5DCDD',
                            200: '#E8B4B8',
                            300: '#D89498',
                            400: '#C7757A'
                        },
                        cokelat: {
                            light: '#9E6B47',
                            DEFAULT: '#6B4226',
                            dark: '#4A2C17'
                        },
                        teks: {
                            DEFAULT: '#2F2A25',
                            light: '#6E675F'
                        }
                    },
                    fontFamily: {
                        serif: ['Playfair Display', 'serif'],
                        sans: ['Poppins', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #FAF3E8;
            color: #2F2A25;
        }
        .font-serif-title {
            font-family: 'Playfair Display', serif;
        }
        .source-card {
            background: #FDFBF7;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .source-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(107, 66, 38, 0.12);
        }
    </style>
</head>
<body class="min-h-screen py-10 px-4 sm:px-8">

    <div class="max-w-7xl mx-auto">
        
        <!-- HEADER SECTION -->
        <div class="text-center max-w-2xl mx-auto mb-12">
            <div class="inline-flex items-center gap-2 bg-rose-100 border border-rose-200 text-cokelat text-xs font-semibold px-4 py-1.5 rounded-full mb-3 uppercase tracking-widest shadow-sm">
                <i class="fa-solid fa-camera text-rose-400"></i> Photography Credits
            </div>
            <h1 class="font-serif-title text-3xl sm:text-5xl font-bold text-cokelat mb-3">Image Sources</h1>
            <p class="text-teks-light text-sm sm:text-base leading-relaxed">
                Transparency and respect for original creators. Below is the full collection of photography assets used across Natacakery with direct links to their source platforms.
            </p>
        </div>

        <!-- IMAGE SOURCES GRID -->
        <div id="sourceGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>

        <!-- FOOTER MEMO -->
        <div class="mt-16 text-center text-xs text-teks-light">
            <p>© 2026 Natacakery | All photography assets sourced under public domain / Unsplash licensing.</p>
        </div>

    </div>

    <!-- JAVASCRIPT RENDER SCRIPT -->

            }
        ];

        document.addEventListener('DOMContentLoaded', function() {
            const grid = document.getElementById('sourceGrid');
            grid.innerHTML = imageAssets.map(item => `
                <div class="source-card rounded-2xl border border-cream-300 overflow-hidden flex flex-col justify-between">
                    <div>
                        <div class="relative h-44 overflow-hidden bg-cream-200">
                            <img src="${item.sourceUrl}" alt="${item.name}" class="w-full h-full object-cover">
                            <span class="absolute top-3 left-3 bg-cokelat text-cream-100 text-[10px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wider">${item.category}</span>
                        </div>
                        <div class="p-4">
                            <h3 class="font-serif-title font-bold text-base text-cokelat mb-1">${item.name}</h3>
                            <p class="text-xs text-teks-light leading-relaxed">${item.desc}</p>
                        </div>
                    </div>
                    <div class="p-4 pt-0">
                        <a href="${item.sourceUrl}" target="_blank" rel="noopener noreferrer" class="w-full bg-cream-200 hover:bg-rose-200 text-cokelat text-xs font-semibold py-2.5 rounded-xl transition-all flex items-center justify-center gap-2 border border-cream-300">
                            <i class="fa-solid fa-arrow-up-right-from-square"></i> Open Original Image
                        </a>
                    </div>
                </div>
            `).join('');
        });
    </script>

</body>
</html>
